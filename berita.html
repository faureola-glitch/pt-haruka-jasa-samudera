"1":{title:"Digitalisasi Pelabuhan dan Efisiensi Arus Kontainer",date:"Artikel informasi",image:"https://images.unsplash.com/photo-1494412574643-ff11b0a5c1c3?auto=format&fit=crop&w=1400&q=85",paras:["Digitalisasi dalam kegiatan kepelabuhanan dapat membantu memperlancar pertukaran informasi antara pemilik barang, operator terminal, perusahaan pelayaran, dan penyedia jasa logistik. Informasi yang tersusun secara elektronik memudahkan pemantauan tahapan operasional serta koordinasi jadwal.","Dalam proses logistik kontainer, ketepatan data dan kelengkapan dokumen merupakan hal penting. Penggunaan sistem pencatatan yang terintegrasi dapat membantu mengurangi pengulangan input, mempercepat pencarian informasi, dan mendukung pengambilan keputusan operasional.","Perusahaan perlu memastikan bahwa penggunaan teknologi disertai prosedur kerja yang jelas, keamanan data, serta sumber daya manusia yang memahami proses operasional. Artikel ini merupakan informasi umum, bukan laporan peristiwa terkini."]},
"2":{title:"Hal yang Perlu Diperhatikan dalam Stuffing Kontainer",date:"Artikel informasi",image:"https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=1400&q=85",paras:["Stuffing kontainer adalah proses memasukkan dan menata barang ke dalam kontainer untuk dipersiapkan dalam pengiriman. Perencanaan sebelum pemuatan membantu memastikan proses berlangsung tertib dan sesuai karakteristik barang.","Beberapa hal yang perlu diperhatikan meliputi pemeriksaan kondisi kontainer, kesesuaian jumlah dan jenis barang dengan dokumen, distribusi berat muatan, perlindungan barang, serta penggunaan alat bantu dan pengaman muatan yang sesuai.","Koordinasi antara petugas lapangan dan pihak terkait juga diperlukan agar proses pemuatan dapat berjalan sesuai instruksi kerja. Seluruh aktivitas harus mengikuti ketentuan keselamatan dan prosedur yang berlaku."]},
"3":{title:"Keselamatan Kerja dalam Penanganan Kargo",date:"Artikel informasi",image:"https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1400&q=85",paras:["Keselamatan dan kesehatan kerja merupakan bagian penting dalam aktivitas penanganan kargo, pemuatan, dan pembongkaran barang. Area kerja logistik memiliki potensi risiko yang perlu dikenali dan dikendalikan sebelum pekerjaan dimulai.","Pemeriksaan area, penggunaan alat pelindung diri, komunikasi antarpekerja, serta pengoperasian peralatan sesuai kompetensi dan prosedur merupakan langkah dasar yang perlu diterapkan. Penataan area kerja juga membantu mengurangi risiko tersandung, tertimpa, atau tertabrak peralatan.","Penerapan budaya keselamatan membutuhkan komitmen seluruh pihak. Evaluasi rutin dan pelaporan kondisi tidak aman dapat membantu perusahaan meningkatkan kualitas operasional secara berkelanjutan. Artikel ini bersifat edukatif dan bukan pengganti standar K3 resmi."]}
